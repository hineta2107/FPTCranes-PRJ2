project:
  name: ai_job_market_salary_prediction
  display_name: AI Job Market Salary Prediction
  seed: 42
  task: supervised_regression
  target: annual_salary_usd

data:
  raw_path: data/raw/ai_jobs_market_2025_2026.csv
  canonical_rename:
    "AI Engineering": job_category

split:
  strategy: temporal_locked_holdout
  locked_test:
    year: 2026
    month: 3
  temporal_cv_folds: 5

features:
  structured:
    - job_title
    - job_category
    - years_of_experience
    - education_required
    - city
    - country
    - remote_work
    - company_size
    - industry
    - demand_score
    - benefits_score_10
  phase2:
    - required_skills
    - skill_count
  nominal:
    - job_title
    - job_category
    - city
    - country
    - remote_work
    - industry
  ordinal:
    education_required:
      - Bootcamp/Self-taught
      - Associate's
      - Bachelor's
      - Master's
      - PhD
    company_size:
      - Startup (1-50)
      - SME (51-500)
      - Mid-size (501-5000)
      - Enterprise (5000+)
      - Big Tech (FAANG+)
  numeric:
    - years_of_experience
    - demand_score
    - benefits_score_10
    - skill_count
  blocked:
    - job_id
    - salary_min_usd
    - salary_max_usd
    - salary_tier
    - experience_level
    - posting_year
    - posting_month
    - is_senior
    - is_remote_friendly
    - is_llm_role
    - ai_salary_premium_pct
    - demand_growth_yoy_pct
  contradictory:
    - years_of_experience
    - experience_level

preprocessing:
  numeric_imputer: median
  nominal_imputer: most_frequent
  scale_for_linear_distance_models: robust
  handle_unknown: ignore
  skill_delimiter: "|"

analysis:
  hidden_missing_tokens: ["", "na", "n/a", "none", "null", "nan", "unknown", "-"]
  top_correlations: 30
  vif_review: 5.0
  vif_high: 10.0
  pairwise_correlation_high: 0.85
  importance_concentration_warning: 0.80
  min_segment_rows: 15

modeling:
  primary_metric: MAE
  secondary_metrics: [RMSE, R2, MedAE]
  dummy_strategy: median
  random_forest:
    n_estimators: 300
    min_samples_leaf: 2
    max_features: 0.8
  gradient_boosting:
    n_estimators: 200
    learning_rate: 0.05
    max_depth: 2
    loss: huber
  svr:
    C: 100.0
    epsilon: 0.1
    gamma: scale

prediction:
  interval_quantile: 0.90
  demo_username: admin
  demo_password: AIJob2026!

artifacts:
  output_root: outputs
  bundle_path: artifacts/model_bundle.joblib
